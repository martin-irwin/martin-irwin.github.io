<style>
  /* Style and pigment switcher: collapsed it shows only the current style and pigment;
     hover, focus or a tap opens both rows with their labels. */
  .pig { font-family: "JetBrains Mono", monospace; position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; background: rgba(0,0,0,.55); padding: 6px; border-radius: 15px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: #fff; transition: padding .32s ease; }
  .pig-row { display: flex; align-items: center; gap: 0; transition: gap .32s ease; }
  .pig-row > span { max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; transition: max-width .32s ease, opacity .25s ease, margin .32s ease; }
  .pig:hover, .pig:focus-within, .pig.open { padding: 6px 8px; }
  .pig:hover .pig-row, .pig:focus-within .pig-row, .pig.open .pig-row { gap: 6px; }
  .pig:hover .pig-row > span, .pig:focus-within .pig-row > span, .pig.open .pig-row > span { max-width: 80px; opacity: 1; margin: 0 2px 0 4px; }
  .pig button { position: relative; flex: none; height: 18px; padding: 0; cursor: pointer; transition: transform .18s ease, width .32s ease, padding .32s ease, opacity .25s ease; }
  .pig button::after { content: ''; position: absolute; inset: -13px -3px; }
  .pig button:not(.on) { width: 0; padding: 0; border-width: 0; opacity: 0; pointer-events: none; }
  .pig:hover button, .pig:focus-within button, .pig.open button { opacity: 1; pointer-events: auto; }
  .pig [data-p] { width: 18px; border-radius: 50%; border: 2px solid transparent; }
  .pig:hover [data-p], .pig:focus-within [data-p], .pig.open [data-p] { width: 18px; border-width: 2px; }
  .pig [data-p]:hover { transform: scale(1.15); }
  .pig [data-p].on { border-color: #fff; }
  .pig [data-s] { width: auto; padding: 0 6px; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; background: transparent; color: #fff; font: inherit; letter-spacing: inherit; }
  .pig:hover [data-s], .pig:focus-within [data-s], .pig.open [data-s] { width: auto; padding: 0 6px; border-width: 1px; }
  .pig [data-s].on { background: #fff; color: #000; border-color: #fff; }
  .pig [data-p="ultra"] { background: #1B2CC1; }
  .pig [data-p="sage"] { background: #A3D1B3; }
  .pig [data-p="orange"] { background: #F47B30; }
  .pig [data-p="rose"] { background: #E9B8C4; }
  .pig [data-p="ochre"] { background: #E3B23C; }
  .pig [data-p="graphite"] { background: #3A3A3F; }
  .pig [data-p="petrol"] { background: #0E4F5C; }
  .pig [data-p="oxblood"] { background: #6B1626; }
  .pig [data-p="graphite"], .pig [data-p="petrol"], .pig [data-p="oxblood"] { box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
  @media (prefers-reduced-motion: reduce) { .pig, .pig-row, .pig-row > span, .pig button { transition: none; } }
  /* a new pigment or style flows in as a circle from the swatch that was picked, as the day flows in on terminus.events */
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-new(root) { animation: pig-flow 1s cubic-bezier(.2,.7,.2,1); }
  @keyframes pig-flow { from { clip-path: circle(0 at var(--fx, 100%) var(--fy, 100%)); } to { clip-path: circle(160% at var(--fx, 100%) var(--fy, 100%)); } }
</style>

<div class="pig">
  <div class="pig-row"><span>Style</span><button data-s="01" type="button" title="Mono">01</button><button data-s="02" type="button" title="Signal">02</button></div>
  <div class="pig-row"><span>Pigment</span><button data-p="ultra" aria-label="Ultramarine" title="Ultramarine"></button><button data-p="sage" aria-label="Sage" title="Sage"></button><button data-p="orange" aria-label="Orange" title="Orange"></button><button data-p="rose" aria-label="Rose" title="Rose"></button><button data-p="ochre" aria-label="Ochre" title="Ochre"></button><button data-p="graphite" aria-label="Graphite" title="Graphite"></button><button data-p="petrol" aria-label="Petrol" title="Petrol"></button><button data-p="oxblood" aria-label="Oxblood" title="Oxblood"></button></div>
</div>

<script>
  (function () {
    var box = document.querySelector('.pig'), r = document.documentElement;
    function mark() {
      box.querySelectorAll('[data-p]').forEach(function (b) {
        var on = b.dataset.p === r.dataset.pigment;
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
      });
      box.querySelectorAll('[data-s]').forEach(function (b) {
        var on = b.dataset.s === (r.dataset.look || '01');
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
      });
    }
    function pigment(p) {
      var c = window.PIGMENTS[p];
      r.dataset.pigment = p; r.dataset.flood = '';
      r.style.setProperty('--pigment', c[0]); r.style.setProperty('--n-bg', c[1]); r.style.setProperty('--n-fg', c[2]);
      try { localStorage.setItem('k-pigment', p); } catch (e) {}
    }
    function style(s) {
      if (s === '02') { window.lookFont(); r.dataset.look = '02'; } else { delete r.dataset.look; }
      try { localStorage.setItem('k-style', s); } catch (e) {}
    }
    function flow(b, change) {
      if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { change(); return; }
      var o = b.getBoundingClientRect();
      r.style.setProperty('--fx', (o.left + o.width / 2) + 'px'); r.style.setProperty('--fy', (o.top + o.height / 2) + 'px');
      document.startViewTransition(function () {
        change();
        /* give the 02 grotesk a moment to arrive so the new page isn't captured in the fallback font */
        if (r.dataset.look === '02' && document.fonts) return Promise.race([document.fonts.load('700 1em "Schibsted Grotesk"'), new Promise(function (ok) { setTimeout(ok, 400); })]);
      });
    }
    /* a tap on the current choice opens the switcher where there is no hover; a pick closes it */
    box.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        var was = b.classList.contains('on');
        if (was) { box.classList.toggle('open'); return; }
        flow(b, function () {
          if (b.dataset.p) pigment(b.dataset.p); else style(b.dataset.s);
          mark();
          box.classList.remove('open');
        });
      });
    });
    document.addEventListener('click', function (e) { if (!e.target.closest('.pig')) box.classList.remove('open'); });
    mark();
  })();
</script>
