# mdlp / netmd / himd: true | false | null (null = not confirmed)
# status:    owned | sold
# colour, qty: this collection's unit(s)
# listed_as: how the unit was first written down, when it differs from the model number
# check:     anything still to confirm
# review / guide: site paths to a write-up of this model
# photo:     path to an image, e.g. /assets/minidisc/mz-r55.jpg

